# Production stack. Copied to a deploy folder outside the repository (see README.md), so
# nothing here reads files from the development checkout.
name: budgetmaster-prod

services:
  db:
    image: postgres:18
    container_name: budgetmaster-prod-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: budgetmaster
      POSTGRES_USER: budgetmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql
    # No host port: only the app reaches it. Use `docker compose exec db psql` for access.
    healthcheck:
      # Over TCP: on the first start the image runs a temporary socket-only server, which
      # would pass a socket check before the real one is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U budgetmaster -d budgetmaster"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Applies pending migrations, then exits; the app starts only after it succeeded.
  migrate:
    image: ghcr.io/akoskappel/budgetmaster:${IMAGE_TAG:?set IMAGE_TAG in .env}
    command: ["node", "scripts/migrate.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://budgetmaster:${DB_PASSWORD}@db:5432/budgetmaster
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  app:
    image: ghcr.io/akoskappel/budgetmaster:${IMAGE_TAG}
    container_name: budgetmaster-prod-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgres://budgetmaster:${DB_PASSWORD}@db:5432/budgetmaster
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:-BudgetMaster <onboarding@resend.dev>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # No host port: nginx in front of it is the only way in.
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # In front of the app: access log for the traffic dashboard and CrowdSec, maintenance
  # page (flag file maintenance/on), and the page while the app restarts.
  nginx:
    image: nginx:1.30-alpine
    container_name: budgetmaster-prod-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:80"
    volumes:
      # Folders, not single files, so an updated config is seen after a reload.
      - ./nginx:/etc/nginx/conf.d:ro
      - ./maintenance:/usr/share/nginx/maintenance:ro
      - ${ACCESS_LOG_DIR:?set ACCESS_LOG_DIR in .env}:/var/log/nginx/shared
    # What the master process needs to bind :80, switch workers to the nginx user and
    # create log files in the host folder (owned by the host user, hence DAC_OVERRIDE).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    networks:
      - app-network
    depends_on:
      app:
        condition: service_healthy

  # Nightly compressed dump of the database into BACKUP_DIR on the host, kept for 14 days.
  # Copy that folder off the machine for protection against disk loss (H-02).
  backup:
    image: postgres:18
    container_name: budgetmaster-prod-backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      PGHOST: db
      PGUSER: budgetmaster
      PGDATABASE: budgetmaster
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # Written to a temporary file first, so a failed dump never leaves an empty file
          # that looks like a backup; a failure is retried after 5 minutes.
          if pg_dump --format=custom --file=/backups/.in-progress.dump; then
            mv /backups/.in-progress.dump "/backups/budgetmaster-$$(date +%F).dump"
            find /backups -name 'budgetmaster-*.dump' -mtime +14 -delete
            echo "backup written $$(date +%F)"
            sleep 86400
          else
            rm -f /backups/.in-progress.dump
            echo "backup failed, retrying in 5 minutes"
            sleep 300
          fi
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
