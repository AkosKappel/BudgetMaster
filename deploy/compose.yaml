# Production stack. Copied to a deploy folder outside the repository (see README.md), so
# nothing here reads files from the development checkout.
name: budgetmaster-prod

services:
  db:
    image: postgres:18
    container_name: budgetmaster-prod-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: budgetmaster
      POSTGRES_USER: budgetmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql
    # No host port: only the app reaches it. Use `docker compose exec db psql` for access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetmaster -d budgetmaster"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  # Applies pending migrations, then exits; the app starts only after it succeeded.
  migrate:
    image: ghcr.io/akoskappel/budgetmaster:${IMAGE_TAG:?set IMAGE_TAG in .env}
    command: ["node", "scripts/migrate.ts"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://budgetmaster:${DB_PASSWORD}@db:5432/budgetmaster
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  app:
    image: ghcr.io/akoskappel/budgetmaster:${IMAGE_TAG}
    container_name: budgetmaster-prod-app
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgres://budgetmaster:${DB_PASSWORD}@db:5432/budgetmaster
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:-BudgetMaster <onboarding@resend.dev>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  # Maintenance mode (H-07): answers as `app` with a 503 page while the app is stopped for a
  # migration or a restore. Only started on purpose, see README.md.
  maintenance:
    image: nginx:1.29-alpine
    container_name: budgetmaster-prod-maintenance
    profiles: ["maintenance"]
    restart: "no"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    deploy:
      resources:
        limits:
          memory: 32M
    volumes:
      - ./maintenance/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./maintenance/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:3000"
    networks:
      app-network:
        aliases:
          - app

  # Nightly compressed dump of the database into BACKUP_DIR on the host, kept for 14 days.
  # Copy that folder off the machine for protection against disk loss (H-02).
  backup:
    image: postgres:18
    container_name: budgetmaster-prod-backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      PGHOST: db
      PGUSER: budgetmaster
      PGDATABASE: budgetmaster
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --file="/backups/budgetmaster-$$(date +%F).dump" \
            && find /backups -name 'budgetmaster-*.dump' -mtime +14 -delete \
            && echo "backup written $$(date +%F)"
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  dbdata:

networks:
  app-network:
