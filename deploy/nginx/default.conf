# nginx in front of the app, like the other apps on the server: one access log in the
# `combined` format for the traffic dashboard and CrowdSec, and the maintenance page.

# The visitor's address comes from the Tailscale sidecar, which reaches nginx over a Docker
# network (all in 172.16.0.0/12); the access log shows it instead of the sidecar's.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined;
    # a copy on the host for the traffic dashboard and CrowdSec (ACCESS_LOG_DIR in .env)
    access_log /var/log/nginx/shared/access.log combined;
    error_log  /var/log/nginx/error.log;
    server_tokens off;

    # The app sets the security headers itself (a CSP with a nonce per response, HSTS).
    # The CSV import sends up to 1,000 rows at once.
    client_max_body_size 2m;

    # Docker's DNS; re-resolve the app container so recreating it doesn't leave a stale IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:3000;
    absolute_redirect off;

    # Maintenance mode: `touch maintenance/on` in the deploy folder, remove the file to end
    # it. The same page covers a restarting app (502/504), e.g. during a deploy. The app's
    # own 503 (the health check with the database down) passes through unchanged.
    if (-f /usr/share/nginx/maintenance/on) {
        return 503;
    }
    error_page 502 503 504 =503 @maintenance;
    location @maintenance {
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
        # The file handler answers 405 to anything but GET and HEAD; requests the open app
        # sends (server functions) get a short 503 instead.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503 "BudgetMaster is being updated. Try again in a few minutes.\n";
        }
        root /usr/share/nginx/maintenance;
        rewrite ^ /index.html break;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Passed on unchanged: Better Auth's rate limits key on the visitor in it
        # (src/lib/auth.ts), and the sidecar already replaces a client-supplied value.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass $app_upstream;
    }
}
