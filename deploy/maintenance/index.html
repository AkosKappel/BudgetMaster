<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Back soon | BudgetMaster</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f1f4ef, #0f1d1a);
        --fg: light-dark(#16302b, #e6ece5);
        --muted: light-dark(#50635e, #9db0a9);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 24rem;
        padding: 1.5rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        border: 0;
        background: var(--fg);
        color: var(--bg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Back in a few minutes</h1>
      <p>
        BudgetMaster is being updated. Your data is safe and nothing you entered
        is lost. Try again in a few minutes.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
