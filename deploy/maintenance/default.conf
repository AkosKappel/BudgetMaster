# Stands in for the app while it is stopped for a migration or a restore: every path,
# /api/health included, answers 503 with the maintenance page, so browsers and monitors
# both see that the app is down on purpose.
server {
    listen 3000;
    root /usr/share/nginx/html;

    error_page 503 @maintenance;

    location @maintenance {
        # The static file handler answers 405 to anything but GET and HEAD; requests the
        # open app sends (server functions) get a short 503 instead.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 503 "BudgetMaster is being updated. Try again in a few minutes.\n";
        }
        rewrite ^ /index.html break;
        add_header Retry-After 600 always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 503;
    }
}
