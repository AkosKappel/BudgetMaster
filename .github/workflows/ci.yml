name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: budgetmaster
          POSTGRES_USER: budgetmaster
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetmaster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://budgetmaster:ci-only@localhost:5432/budgetmaster
      # Test-only value for a throwaway database, not a real secret.
      BETTER_AUTH_SECRET: ci-only-auth-secret-for-the-e2e-database
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
      # Desktop Lighthouse on the public pages: performance 90, accessibility, best practices
      # and SEO 100, at most 300 KB of compressed JavaScript. CI only, never on the server.
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        env:
          PORT: 3200
          BETTER_AUTH_URL: http://localhost:3200
        with:
          configPath: ./lighthouserc.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/

  image:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/akoskappel/budgetmaster
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Build into the local Docker engine first, so the scan sees the exact image.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: budgetmaster:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on fixable high or critical vulnerabilities; scans never run on the home server.
      # Pinned to a commit: this action's tags were hijacked in a 2026 supply-chain attack.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: budgetmaster:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Pull requests only build and scan; main also pushes to GHCR (from the build cache).
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
