services:
  db:
    image: postgres:18
    container_name: budgetmaster-db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      POSTGRES_DB: budgetmaster
      POSTGRES_USER: budgetmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetmaster -d budgetmaster"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # PostgreSQL 18 data (postgres:18 mounts /var/lib/postgresql)
  dbdata:
